<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#741f1f">
<title>Narayaan Sweets  - Digital Menu</title>
<style>
:root{--primary:#611a1a;--primary-dark:#361414;--accent:#d6a24a;--background:#f8f5ef;--card:#fff;--text:#292522;--muted:#77716a;--border:#e5ddd3}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  min-width:320px;
  background:var(--background);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.5
}

.page{
  width:100%;
  max-width:720px;
  min-height:100vh;
  margin:0 auto
}

img{
  display:block;
  max-width:100%
}

.restaurant-header{
  padding:38px 20px 30px;
  color:#fff;
  background:
    radial-gradient(circle at top right,rgba(214,162,74,.25),transparent 35%),
    linear-gradient(145deg,var(--primary-dark),var(--primary))
}

.restaurant-label{
  margin-bottom:9px;
  color:#f3d99d;
  font-size:11px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase
}

.restaurant-name{
  margin-bottom:18px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(32px,9vw,48px);
  line-height:1.05
}

.restaurant-details{
  display:grid;
  gap:10px
}

.restaurant-detail{
  display:flex;
  align-items:center;
  gap:9px;
  color:rgba(255,255,255,.92);
  font-size:14px
}

.restaurant-detail a{
  color:inherit;
  text-decoration:none
}

.detail-icon{
  width:20px;
  flex-shrink:0;
  color:var(--accent)
}

main{
  padding:28px 16px 0
}

.menu-introduction{
  margin:0 4px 25px
}

.menu-label{
  color:var(--primary);
  font-size:11px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase
}

.menu-title{
  margin-top:4px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:30px
}

.category{
  margin-bottom:28px
}

.category-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:10px
}

.category-title{
  color:var(--primary);
  font-size:13px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  white-space:nowrap
}

.category-line{
  flex:1;
  height:1px;
  background:var(--border)
}

.menu-list{
  overflow:hidden;
  background:var(--card);
  border-radius:10px;
  box-shadow:0 3px 12px rgba(50,30,20,.04)
}

.menu-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  min-height:54px;
  padding:12px 15px;
  border-bottom:1px solid #eee7df
}

.menu-item:last-child{
  border-bottom:none
}

.menu-item-name{
  flex:1;
  color:var(--text);
  font-size:15px;
  font-weight:500
}

.menu-item-price{
  flex-shrink:0;
  color:var(--primary);
  font-size:15px;
  font-weight:700;
  white-space:nowrap
}


/* =========================================================
  ADVERTISEMENT SECTION
  FULL IMAGE VISIBLE - NO CROPPING
   ========================================================= */

.advertisement-section{
  margin-top:30px;
  padding:0 16px 30px
}

.ad-heading{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px
}

.ad-heading-text{
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  white-space:nowrap
}

.ad-heading-line{
  flex:1;
  height:1px;
  background:var(--border)
}


/* Advertisement container */

.ad-slider{
  overflow:hidden;
  border-radius:14px;
  background:#fff;
  box-shadow:0 8px 25px rgba(50,30,20,.08)
}

.ad-track{
  display:flex;
  width:100%;
  transition:transform 450ms ease
}


/*
   IMPORTANT:
   Height is NOT fixed.
   The advertisement image decides its own height.
   This prevents cropping.
*/

.ad-slide{
  position:relative;
  flex:0 0 100%;
  min-width:100%;
  width:100%;
  height:auto;
  min-height:0;
  overflow:hidden;
  background:#fff;

  display:flex;
  align-items:center;
  justify-content:center;
}


/*
   FULL IMAGE
   object-fit:contain = NO CROPPING
*/

.ad-image{
  display:block;
  width:100%;
  height:auto;
  max-width:100%;
  object-fit:contain;
  object-position:center;
}


/*
   Advertisement overlay
*/

.ad-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(0,0,0,.90),
    rgba(0,0,0,.08)
  )
}

.ad-content{
  position:absolute;
  right:0;
  bottom:0;
  left:0;
  padding:18px
}

.ad-badge{
  display:inline-block;
  margin-bottom:5px;
  padding:3px 7px;
  border-radius:4px;
  background:var(--accent);
  color:#24170d;
  font-size:9px;
  font-weight:700;
  text-transform:uppercase
}

.ad-title{
  margin-bottom:3px;
  color:#fff;
  font-size:20px;
  font-weight:700
}

.ad-description{
  margin-bottom:10px;
  color:rgba(255,255,255,.88);
  font-size:12px
}

.ad-buttons{
  display:flex;
  gap:7px
}

.ad-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:32px;
  padding:6px 12px;
  border-radius:6px;
  background:#fff;
  color:#261d19;
  font-size:11px;
  font-weight:700;
  text-decoration:none
}

.ad-button.secondary{
  border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.12);
  color:#fff
}


/* Slider controls */

.slider-controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:9px 10px;
  background:#fff
}

.slider-button{
  width:34px;
  height:34px;
  border:1px solid var(--border);
  border-radius:50%;
  background:#fff;
  color:var(--primary);
  cursor:pointer;
  font-size:18px
}

.slider-button:active{
  transform:scale(.94)
}

.slider-dots{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px
}

.slider-dot{
  width:7px;
  height:7px;
  padding:0;
  border:none;
  border-radius:50%;
  background:#d7d0c8;
  cursor:pointer
}

.slider-dot.active{
  width:20px;
  border-radius:10px;
  background:var(--primary)
}


footer{
  padding:10px 20px 35px;
  text-align:center
}

.footer-thank{
  margin-bottom:4px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:17px
}

.footer-name{
  margin-bottom:7px;
  color:var(--primary);
  font-size:13px;
  font-weight:700
}

.footer-digital{
  color:var(--muted);
  font-size:10px;
  letter-spacing:1px;
  text-transform:uppercase
}


/* Desktop / Tablet */

@media(min-width:600px){

  .restaurant-header{
    padding:50px 40px 40px
  }

  main{
    padding:35px 30px 0
  }

  .advertisement-section{
    padding-left:30px;
    padding-right:30px
  }

  /*
     No fixed advertisement height here either.
     Image keeps its original aspect ratio.
  */

  .ad-slide{
    height:auto;
    min-height:0
  }

}


/* Reduced motion */

@media(prefers-reduced-motion:reduce){

  html{
    scroll-behavior:auto
  }

  .ad-track{
    transition:none
  }

}
</style
</head>
<body>
<div class="page">
<header class="restaurant-header">
<div class="restaurant-label">Digital Menu</div>
<h1 class="restaurant-name" id="restaurantName"></h1>
<div class="restaurant-details">
<div class="restaurant-detail"><span class="detail-icon" aria-hidden="true">📍</span><a id="restaurantAddress" href="#" target="_blank" rel="noopener noreferrer"></a></div>
<div class="restaurant-detail"><span class="detail-icon" aria-hidden="true">📞</span><a id="restaurantPhone" href="#"></a></div>
</div>
</header>
<main>
<section aria-labelledby="menuTitle">
<div class="menu-introduction"><div class="menu-label">Our Menu</div><h2 class="menu-title" id="menuTitle">Menu</h2></div>
<div id="menuContainer"></div>
</section>
</main>
<section class="advertisement-section" aria-label="Advertisements">
<div class="ad-heading"><span class="ad-heading-text">Advertisement</span><span class="ad-heading-line"></span></div>
<div class="ad-slider" id="adSlider">
<div class="ad-track" id="adTrack"></div>
<div class="slider-controls">
<button class="slider-button" id="previousAd" type="button" aria-label="Previous advertisement">‹</button>
<div class="slider-dots" id="sliderDots" aria-label="Advertisement slides"></div>
<button class="slider-button" id="nextAd" type="button" aria-label="Next advertisement">›</button>
</div>
</div>
</section>
<footer>
    <div class="footer-thank">Thank you for visiting</div>
    <div class="footer-name" id="footerRestaurantName"></div>
    <div class="footer-digital">Digital Menu</div>

    <div style="margin-top:15px;padding-top:12px;border-top:1px solid #e5ddd3;color:#77716a;font-size:12px;line-height:1.6;">
        © 2026 Agnotech Solutions. All Rights Reserved.<br>
        Designed & Developed by Agnotech Solutions.<br>
    </div>
</footer>

<script>
/* =========================================================
   RESTAURANT CONFIGURATION - CHANGE RESTAURANT DETAILS HERE
   ========================================================= */
const restaurant={
name:"Narayan Sweets & Restaurant",
address:"Opp. Raj Niwas Marriage Hall, Near Kunda Thana, Deoghar, Jharkhand",
phone:"+91 62005 09914",
mapsUrl:"https://maps.app.goo.gl/eHt52TiZL1JmbyZf9"
};

/* =========================================================
   MENU CONFIGURATION - CHANGE MENU ITEMS AND PRICES HERE
   ========================================================= */
const menu = [

{category:"Dosa",items:[
{name:"Sambhar Vada",price:60},
{name:"Idli Sambhar",price:50},
{name:"Paneer Dosa",price:120},
{name:"Paneer Cheese Dosa",price:130},
{name:"Onion Masala Dosa",price:110},
{name:"Butter Masala Dosa",price:120},
{name:"Butter Plain Dosa",price:110},
{name:"Cheese Plain Dosa",price:110},
{name:"Paneer Butter Plain Dosa",price:120},
{name:"Plain Dosa",price:80},
{name:"Rava Paneer Dosa",price:120},
{name:"Rava Plain Dosa",price:90},
{name:"Raja Rani Dosa",price:200},
{name:"Narayan Special Dosa",price:150},
{name:"Butter Cheese Masala Dosa",price:150},
{name:"Mysore Masala Dosa",price:120},
{name:"Pizza Dosa",price:150},
{name:"Onion Plain Dosa",price:90},
{name:"Coconut Masala Dosa",price:110},
{name:"Butter Plain Uttapam",price:90},
{name:"Onion Uttapam",price:80},
{name:"Onion Tomato Uttapam",price:100},
{name:"Masala Uttapam",price:90},
{name:"Mix Veg Uttapam",price:100},
{name:"Masala Dosa",price:100},
{name:"Paneer Uttapam",price:130},
{name:"Tomato Uttapam",price:90},
{name:"Narayan Special Uttapam",price:180}
]},

{category:"Chaat",items:[
{name:"Tikki Chole Chaat",price:50},
{name:"Dhai Tikki Chat",price:50},
{name:"Samosa Chole Chaat",price:60},
{name:"Dahi Samosa Chaat",price:50},
{name:"Raj Kachori Chaat",price:70},
{name:"Papdi Chaat",price:50},
{name:"Dahi Bhalla Chaat",price:60},
{name:"Bhalla Papdi Chaat",price:70},
{name:"Raj Bhoj Chaat",price:60},
{name:"Miix Chaat",price:80},
{name:"Idli Chaat",price:60},
{name:"Chole Bhature",price:90},
{name:"Special Dahi Puri",price:50}
]},

{category:"Snacks & More",items:[
{name:"Samosa",price:10},
{name:"Vegetable Cutlet",price:15},
{name:"Puri Sabji",price:0}
]}

];

/* =========================================================
   ADVERTISEMENT CONFIGURATION - CHANGE ADVERTISEMENTS HERE
   The slider automatically changes every 3 seconds.
   ========================================================= */
const advertisements = [
    {
        id: "ad-001",
        image: "images/Self_Ads_Hindi.png",
        title: "Agnotech Solutions",
        description: "Your Digital Partner",
        phone: "+91 96934 33741",
        link: "#"
    },

    {
        id: "ad-002",
        image: "images/Self_Ads_English.png",
        title: "Agnotech Solutions",
        description: "Your Digital Partner",
        phone: "+91 79030 82642",
        link: "#"
    },

    {
        id: "ad-003",
        image: "images/Self_Ads_Hindi.png",
        title: "Agnotech Solutions",
        description: "Your Digital Partner",
        phone: "+91 96934 33741",
        link: "#"
    },

    {
        id: "ad-004",
        image: "images/Self_Ads_English.png",
        title: "Agnotech Solutions",
        description: "Your Digital Partner",
        phone: "+91 79030 82642",
        link: "#"
    }
];

const AD_INTERVAL=3000;
const menuContainer=document.getElementById("menuContainer");
const adTrack=document.getElementById("adTrack");
const sliderDots=document.getElementById("sliderDots");
const previousAd=document.getElementById("previousAd");
const nextAd=document.getElementById("nextAd");
const adSlider=document.getElementById("adSlider");
let currentAd=0,adTimer=null,resumeTimer=null,sliderPaused=false,touchStartX=0,touchEndX=0;

function renderRestaurant(){
document.getElementById("restaurantName").textContent=restaurant.name;
const address=document.getElementById("restaurantAddress");address.textContent=restaurant.address;address.href=restaurant.mapsUrl;
const phone=document.getElementById("restaurantPhone");phone.textContent=restaurant.phone;phone.href="tel:"+restaurant.phone.replace(/[^\d+]/g,"");
document.getElementById("footerRestaurantName").textContent=restaurant.name;
document.title=restaurant.name+" - Digital Menu";
}

function renderMenu(){
menuContainer.replaceChildren();
menu.forEach(category=>{
const categoryElement=document.createElement("section");categoryElement.className="category";
const header=document.createElement("div");header.className="category-header";
const title=document.createElement("h3");title.className="category-title";title.textContent=category.category;
const line=document.createElement("span");line.className="category-line";header.append(title,line);
const list=document.createElement("div");list.className="menu-list";
category.items.forEach(item=>{
const menuItem=document.createElement("div");menuItem.className="menu-item";
const name=document.createElement("span");name.className="menu-item-name";name.textContent=item.name;
const price=document.createElement("span");price.className="menu-item-price";price.textContent="₹"+Number(item.price).toLocaleString("en-IN");
menuItem.append(name,price);list.appendChild(menuItem);
});
categoryElement.append(header,list);menuContainer.appendChild(categoryElement);
});
}

function renderAdvertisements(){
adTrack.replaceChildren();sliderDots.replaceChildren();
if(!advertisements.length){const message=document.createElement("div");message.style.padding="30px";message.style.textAlign="center";message.textContent="No advertisements available.";adTrack.appendChild(message);return;}
advertisements.forEach((ad,index)=>{
const slide=document.createElement("article");slide.className="ad-slide";slide.dataset.adId=ad.id;
const image=document.createElement("img");image.className="ad-image";image.src=ad.image;image.alt=ad.title+" advertisement";image.loading=index===0?"eager":"lazy";image.decoding="async";
const overlay=document.createElement("div");overlay.className="ad-overlay";
const content=document.createElement("div");content.className="ad-content";
const badge=document.createElement("span");badge.className="ad-badge";badge.textContent="Advertisement";
const title=document.createElement("h3");title.className="ad-title";title.textContent=ad.title;
const description=document.createElement("p");description.className="ad-description";description.textContent=ad.description;
const buttons=document.createElement("div");buttons.className="ad-buttons";
if(ad.phone){const call=document.createElement("a");call.className="ad-button";call.href="tel:"+ad.phone.replace(/[^\d+]/g,"");call.textContent="Call";call.setAttribute("aria-label","Call "+ad.title);buttons.appendChild(call);}
if(ad.link){const visit=document.createElement("a");visit.className="ad-button secondary";visit.href=ad.link;visit.target="_blank";visit.rel="noopener noreferrer";visit.textContent="Visit";visit.setAttribute("aria-label","Visit "+ad.title);buttons.appendChild(visit);}
content.append(badge,title,description,buttons);slide.append(image,overlay,content);adTrack.appendChild(slide);
const dot=document.createElement("button");dot.className="slider-dot";dot.type="button";dot.setAttribute("aria-label","Show advertisement "+(index+1));dot.addEventListener("click",()=>{showAd(index);pauseSlider();scheduleResume();});sliderDots.appendChild(dot);
});
showAd(0);startSlider();
}

function showAd(index){
if(!advertisements.length)return;
currentAd=(index+advertisements.length)%advertisements.length;
adTrack.style.transform="translateX(-"+currentAd*100+"%)";
sliderDots.querySelectorAll(".slider-dot").forEach((dot,i)=>dot.classList.toggle("active",i===currentAd));
}
function nextAdvertisement(){showAd(currentAd+1)}
function previousAdvertisement(){showAd(currentAd-1)}
function startSlider(){stopSlider();if(advertisements.length<=1)return;adTimer=setInterval(()=>{if(!sliderPaused)nextAdvertisement()},AD_INTERVAL)}
function stopSlider(){if(adTimer!==null){clearInterval(adTimer);adTimer=null}}
function pauseSlider(){sliderPaused=true;if(resumeTimer!==null){clearTimeout(resumeTimer);resumeTimer=null}}
function resumeSlider(){sliderPaused=false}
function scheduleResume(){if(resumeTimer!==null)clearTimeout(resumeTimer);resumeTimer=setTimeout(resumeSlider,5000)}

previousAd.addEventListener("click",()=>{previousAdvertisement();pauseSlider();scheduleResume()});
nextAd.addEventListener("click",()=>{nextAdvertisement();pauseSlider();scheduleResume()});
adSlider.addEventListener("mouseenter",pauseSlider);
adSlider.addEventListener("mouseleave",resumeSlider);
adSlider.addEventListener("touchstart",event=>{touchStartX=event.changedTouches[0].screenX;pauseSlider()},{passive:true});
adSlider.addEventListener("touchend",event=>{touchEndX=event.changedTouches[0].screenX;const distance=touchStartX-touchEndX;if(Math.abs(distance)>45){distance>0?nextAdvertisement():previousAdvertisement()}scheduleResume()},{passive:true});
document.addEventListener("visibilitychange",()=>{document.hidden?pauseSlider():resumeSlider()});

document.addEventListener("DOMContentLoaded",()=>{
renderRestaurant();
renderMenu();
renderAdvertisements();
});


</script>
</body>
</html>
